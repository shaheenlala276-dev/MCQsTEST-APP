<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0f172a">

    <title>MCQs Test App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <div class="card">

            <div class="logo">📝</div>

            <h1>MCQs Test App</h1>

            <p class="subtitle">
                Practice smarter. Test your knowledge.
                Prepare for university entrance tests.
            </p>

            <div class="features">

                <div class="feature">
                    <span>⏱️</span>
                    Timed Tests
                </div>

                <div class="feature">
                    <span>📊</span>
                    Results
                </div>

                <div class="feature">
                    <span>✅</span>
                    MCQ Practice
                </div>

                <div class="feature">
                    <span>📚</span>
                    Multiple Subjects
                </div>

            </div>

            <button class="start-btn" onclick="showSubjects()">
                🚀 Start Test
            </button>

            <div class="subjects" id="subjects">

                <h2>Choose Subject</h2>

                <button class="subject-btn"
                    onclick="selectSubject('Computer Science')">
                    💻 Computer Science
                </button>

                <button class="subject-btn"
                    onclick="selectSubject('Mathematics')">
                    📐 Mathematics
                </button>

                <button class="subject-btn"
                    onclick="selectSubject('Physics')">
                    ⚡ Physics
                </button>

                <button class="subject-btn"
                    onclick="selectSubject('English')">
                    📖 English
                </button>

            </div>

            <footer>
                MCQs Test App • University Entry Test Preparation
            </footer>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
